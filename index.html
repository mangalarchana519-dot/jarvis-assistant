
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS Assistant</title>
<style>
*{box-sizing:border-box}
body{
 background:#030914;color:#d8f7ff;font-family:Arial;
 text-align:center;padding:20px;margin:0
}
h1{color:#42dcff;letter-spacing:7px}
.subtitle{color:#759bad;letter-spacing:2px}
.reactor{
 width:145px;height:145px;border:4px solid #36dfff;
 border-radius:50%;margin:30px auto;
 display:grid;place-items:center;
 box-shadow:0 0 25px #00cfff,inset 0 0 20px #00cfff;
 animation:pulse 2s infinite
}
.core{
 width:70px;height:70px;border-radius:50%;
 background:#7beaff;box-shadow:0 0 35px #00cfff
}
@keyframes pulse{
 50%{box-shadow:0 0 40px #00cfff,inset 0 0 30px #00cfff}
}
.panel{
 max-width:520px;margin:20px auto;padding:20px;
 background:#071725;border:1px solid #17617a;
 border-radius:14px
}
input{
 width:100%;padding:14px;margin:12px 0;
 background:#020b14;color:white;
 border:1px solid #267c99;border-radius:8px;
 font-size:16px
}
button{
 padding:12px 16px;margin:5px;
 background:#08283a;color:#b9f5ff;
 border:1px solid #39dfff;border-radius:7px
}
#output{
 text-align:left;min-height:100px;
 max-height:220px;overflow:auto;line-height:1.7
}
.device{display:inline-block;padding:12px;margin:6px;border:1px solid #17617a;border-radius:8px}
.on{color:#54ffad}.off{color:#ff8585}
small{color:#759bad}
</style>
</head>
<body>

<h1>J.A.R.V.I.S.</h1>
<div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div>

<div class="reactor"><div class="core"></div></div>

<div id="status">SYSTEM ONLINE</div>
<div id="clock"></div>

<div class="panel">
<h3>COMMAND CENTER</h3>
<input id="command" placeholder="Enter your command">
<button onclick="processCommand()">EXECUTE</button>
<button onclick="startListening()">MICROPHONE</button>
<button onclick="stopSpeaking()">STOP VOICE</button>
<div id="output">JARVIS: Good day. I am ready.</div>
</div>

<div class="panel">
<h3>SMART HOME</h3>
<div class="device">LIGHT: <span id="light" class="off">OFF</span></div>
<div class="device">FAN: <span id="fan" class="off">OFF</span></div>
<div class="device">AC: <span id="ac" class="off">OFF</span></div>
<small>Simulation only. No real appliances connected.</small>
</div>

<script>
const output=document.getElementById("output");
const statusBox=document.getElementById("status");
let recognition=null;
let remembered="";

function show(message){
 const line=document.createElement("div");
 line.textContent=message;
 output.appendChild(line);
 output.scrollTop=output.scrollHeight;
}

function speak(message){
 if(!window.speechSynthesis)return;
 speechSynthesis.cancel();
 const voice=new SpeechSynthesisUtterance(message);
 voice.rate=0.92;
 voice.pitch=0.85;
 speechSynthesis.speak(voice);
}

function reply(message){
 show("JARVIS: "+message);
 speak(message);
}

function device(name,on){
 const item=document.getElementById(name);
 item.textContent=on?"ON":"OFF";
 item.className=on?"on":"off";
}

function processCommand(){
 const field=document.getElementById("command");
 const original=field.value.trim();
 if(!original)return;

 show("YOU: "+original);
 field.value="";

 const text=original.toLowerCase();
 const wantsOn=/\b(on|start|activate|open)\b/.test(text);
 const wantsOff=/\b(off|stop|deactivate|close)\b/.test(text);

 if(text.includes("what did you remember")){
  reply(remembered||"I have nothing remembered yet.");
  return;
 }

 if(text.startsWith("remember that ")){
  remembered=original.substring(14).trim();
  reply("I will remember that during this session.");
  return;
 }

 if(/\b(light|lights|bulb|bulbs)\b/.test(text)){
  if(wantsOn){device("light",true);reply("Lights switched on in simulation.");}
  else if(wantsOff){device("light",false);reply("Lights switched off in simulation.");}
  else reply("Would you like me to switch the lights on or off?");
  return;
 }

 if(/\bfans?\b/.test(text)){
  if(wantsOn){device("fan",true);reply("Fan switched on in simulation.");}
  else if(wantsOff){device("fan",false);reply("Fan switched off in simulation.");}
  else reply("Would you like me to switch the fan on or off?");
  return;
 }

 if(/\b(ac|air conditioner|air conditioning)\b/.test(text)){
  if(wantsOn){device("ac",true);reply("AC switched on in simulation.");}
  else if(wantsOff){device("ac",false);reply("AC switched off in simulation.");}
  else reply("Would you like me to switch the AC on or off?");
  return;
 }

 if(/\b(hello|hi|hey)\b/.test(text)){
  reply("Hello. All systems are running normally.");
 }
 else if(text.includes("your name")||text.includes("who are you")){
  reply("I am JARVIS, your personal virtual assistant.");
 }
 else if(text.includes("time")){
  reply("The time is "+new Date().toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata"}));
 }
 else if(text.includes("date")||text.includes("day")){
  reply("Today is "+new Date().toLocaleDateString("en-IN",{timeZone:"Asia/Kolkata",weekday:"long",day:"numeric",month:"long",year:"numeric"}));
 }
 else if(text.includes("status")){
  reply("All virtual systems are online.");
 }
 else if(text.includes("help")||text.includes("commands")){
  reply("Try hello, time, date, lights on, fan off, AC on, or remember that I like astronomy.");
 }
 else{
  reply("I do not recognise that command yet. Say help to see available commands.");
 }
}

function startListening(){
 const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Speech){
  reply("Speech recognition is not supported. Please use the text box.");
  return;
 }
 if(recognition)recognition.stop();

 recognition=new Speech();
 recognition.lang="en-IN";
 recognition.onstart=()=>statusBox.textContent="LISTENING...";
 recognition.onend=()=>statusBox.textContent="SYSTEM ONLINE";
 recognition.onerror=e=>statusBox.textContent="MICROPHONE: "+e.error;
 recognition.onresult=e=>{
  document.getElementById("command").value=e.results[0][0].transcript;
  processCommand();
 };
 recognition.start();
}

function stopSpeaking(){
 if(window.speechSynthesis)speechSynthesis.cancel();
}

document.getElementById("command").addEventListener("keydown",e=>{
 if(e.key==="Enter")processCommand();
});

function updateClock(){
 document.getElementById("clock").textContent=
 "INDIA TIME: "+new Date().toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata"});
}

setInterval(updateClock,1000);
updateClock();
</script>
</body>
                             </html>
