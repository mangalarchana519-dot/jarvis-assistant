
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. | Personal Assistant</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at center, #102d48, #030912 75%);
    color: #00eaff;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: 38px;
    letter-spacing: 9px;
    text-shadow: 0 0 20px #00eaff;
    margin-bottom: 5px;
}

.subtitle {
    letter-spacing: 4px;
    font-size: 12px;
    color: #8defff;
}

.clock {
    margin: 25px auto;
    font-size: 27px;
    text-shadow: 0 0 12px #00eaff;
}

.reactor {
    width: 180px;
    height: 180px;
    border: 5px solid #00eaff;
    border-radius: 50%;
    margin: 35px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px #00eaff, inset 0 0 25px #00eaff;
    animation: pulse 2s infinite alternate;
}

.core {
    width: 85px;
    height: 85px;
    border: 3px solid white;
    border-radius: 50%;
    background: #00bfff;
    box-shadow: 0 0 30px #00eaff;
}

@keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
}

.panel {
    max-width: 520px;
    margin: 20px auto;
    padding: 22px;
    border: 1px solid #00bfff;
    border-radius: 15px;
    background: rgba(0, 15, 30, 0.85);
    box-shadow: 0 0 15px #004d70;
}

input, select {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #00eaff;
    background: #061522;
    color: white;
    margin: 8px 0;
    font-size: 15px;
}

button {
    padding: 13px 20px;
    margin: 7px;
    border: 1px solid #00eaff;
    border-radius: 8px;
    background: #00bfff;
    color: #00101c;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

.response {
    min-height: 55px;
    color: white;
    line-height: 1.6;
    margin-top: 20px;
}

.status {
    font-size: 12px;
    color: #7cecff;
    margin-top: 20px;
}

.footer {
    font-size: 11px;
    color: #668da5;
    margin-top: 35px;
}
</style>
</head>

<body>

<h1>J.A.R.V.I.S.</h1>
<div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div>

<div class="clock" id="clock">--:--:--</div>
<div id="date"></div>

<div class="reactor">
    <div class="core"></div>
</div>

<div class="panel">

    <h3>PERSONAL ASSISTANT</h3>

    <input id="command"
        type="text"
        placeholder="Type a command...">

    <button onclick="runCommand()">
        EXECUTE
    </button>

    <button onclick="listen()">
        🎙 ACTIVATE MICROPHONE
    </button>

    <button onclick="stopSpeech()">
        STOP VOICE
    </button>

    <div class="response" id="response">
        Systems online. Awaiting your command.
    </div>

    <div class="status" id="status">
        SYSTEM STATUS: ONLINE
    </div>

    <hr style="border-color:#16445b;margin:20px 0;">

    <label for="voiceSelect">VOICE SELECTION</label>
    <select id="voiceSelect">
        <option value="">Loading available voices...</option>
    </select>

</div>

<div class="footer">
    J.A.R.V.I.S. PERSONAL PROJECT | VERSION 1.0
</div>

<script>
const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

function updateClock() {
    const now = new Date();

    document.getElementById("clock").textContent =
        new Intl.DateTimeFormat("en-IN", {
            timeZone: "Asia/Kolkata",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
        }).format(now);

    document.getElementById("date").textContent =
        new Intl.DateTimeFormat("en-IN", {
            timeZone: "Asia/Kolkata",
            dateStyle: "full"
        }).format(now);
}

setInterval(updateClock, 1000);
updateClock();

function loadVoices() {
    const voices = speechSynthesis.getVoices();
    const select = document.getElementById("voiceSelect");

    select.innerHTML = "";

    if (voices.length === 0) {
        select.innerHTML =
            '<option value="">Default device voice</option>';
        return;
    }

    voices.forEach((voice, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent =
            voice.name + " (" + voice.lang + ")";
        select.appendChild(option);
    });

    const preferred = voices.findIndex(v =>
        v.lang.toLowerCase() === "en-in"
    );

    if (preferred >= 0) {
        select.value = preferred;
    }
}

loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;

function speak(message) {
    speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(message);
    speech.lang = "en-IN";
    speech.rate = 0.9;
    speech.pitch = 0.9;

    const voices = speechSynthesis.getVoices();
    const selected =
        document.getElementById("voiceSelect").value;

    if (selected !== "" && voices[selected]) {
        speech.voice = voices[selected];
    }

    speechSynthesis.speak(speech);
}

function respond(command) {
    let answer = "";
    const now = new Date();

    if (command.includes("hello") ||
        command.includes("hi jarvis") ||
        command === "hi") {

        answer = "Hello! How may I assist you today?";
    }

    else if (command.includes("time")) {
        const time = new Intl.DateTimeFormat("en-IN", {
            timeZone: "Asia/Kolkata",
            hour: "numeric",
            minute: "2-digit",
            hour12: true
        }).format(now);

        answer = "The current Indian time is " + time;
    }

    else if (command.includes("date")) {
        const date = new Intl.DateTimeFormat("en-IN", {
            timeZone: "Asia/Kolkata",
            dateStyle: "long"
        }).format(now);

        answer = "Today is " + date;
    }

    else if (command.includes("status") ||
             command.includes("working")) {

        answer = "All available systems are operational.";
    }

    else if (command.includes("your name") ||
             command.includes("who are you")) {

        answer = "I am JARVIS, your personal assistant.";
    }

    else if (command.includes("help")) {
        answer = "You can ask me for the time, date, or system status. You can also say hello.";
    }

    else if (command.includes("shutdown") ||
             command.includes("shut down") ||
             command.includes("exit")) {

        answer = "Signing off. Have a good day.";
    }

    else {
        answer = "I do not recognise that command yet.";
    }

    document.getElementById("response").textContent = answer;
    speak(answer);
}

function runCommand() {
    const command =
        document.getElementById("command").value
        .toLowerCase().trim();

    if (!command) {
        document.getElementById("response").textContent =
            "Please enter a command.";
        return;
    }

    respond(command);
}

function listen() {
    if (!SpeechRecognition) {
        document.getElementById("response").textContent =
            "Speech recognition is not supported by this browser.";
        return;
    }

    if (recognition) {
        recognition.abort();
    }

    recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    recognition.continuous = false;
    recognition.interimResults = false;

    document.getElementById("status").textContent =
        "STATUS: LISTENING...";

    recognition.onresult = function(event) {
        const command =
            event.results[0][0].transcript.toLowerCase();

        document.getElementById("command").value = command;

        respond(command);
    };

    recognition.onerror = function(event) {
        document.getElementById("response").textContent =
            "Microphone error: " + event.error;
    };

    recognition.onend = function() {
        document.getElementById("status").textContent =
            "SYSTEM STATUS: ONLINE";
    };

    recognition.start();
}

function stopSpeech() {
    speechSynthesis.cancel();

    if (recognition) {
        recognition.abort();
    }

    document.getElementById("status").textContent =
        "SYSTEM STATUS: ONLINE";
}
</script>

</body>
    </html>
